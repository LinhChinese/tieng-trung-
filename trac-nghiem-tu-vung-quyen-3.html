const $=s=>document.querySelector(s),app=$('#app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parse(list){const m=new Map();list.forEach(r=>{const p=r.split('|');if(p.length<3||!p[1]||!p[2])return;const k=p[0]+'|'+p[1];if(!m.has(k))m.set(k,{h:p[0],p:p[1],m:p[2].replace(/\s*\?$/,''),chk:/\?$/.test(p[2])})});return[...m.values()]}
const lessonNames=Object.keys(LESSONS),REVIEW='Quyển 3 — Ôn tổng hợp';let S={};

function start(err=''){
 app.innerHTML=`<h1>🌸 Ôn từ vựng tiếng Trung — Quyển 3</h1><p class="sub">Trắc nghiệm 4 đáp án</p>
 <label>Họ và tên</label><input id="nm" placeholder="Nhập họ tên của em" maxlength="50" autocomplete="off">
 <label>Bài học</label><select id="ls">${lessonNames.map(n=>`<option>${n}</option>`).join('')}<option value="${REVIEW}">⭐ Ôn tổng hợp (30 từ ngẫu nhiên)</option></select>
 <label>Chiều trắc nghiệm</label><div class="seg" id="sg"><button data-m="A" class="on">Hán → Nghĩa</button><button data-m="B">Nghĩa → Hán</button><button data-m="M">Kết hợp</button></div>
 <div class="err" id="er">${err}</div><button class="btn" id="go">Bắt đầu</button>`;
 let mode='A';
 document.querySelectorAll('#sg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#sg button').forEach(x=>x.classList.toggle('on',x===b))});
 $('#go').onclick=()=>{
  const name=$('#nm').value.trim().replace(/\s+/g,' ');
  if(name.length<2||!/\p{L}/u.test(name))return $('#er').textContent='Vui lòng nhập họ tên hợp lệ.';
  const ln=$('#ls').value;let words,pool;if(ln===REVIEW){const seenK=new Set();pool=[];Object.values(LESSONS).forEach(l=>parse(l).forEach(w=>{const k=w.h+'|'+w.p+'|'+w.m;if(!seenK.has(k)){seenK.add(k);pool.push(w)}}));words=[];const uh=new Set();for(const w of shuffle(pool)){if(!uh.has(w.h)){uh.add(w.h);words.push(w);if(words.length==30)break}}}else{words=parse(LESSONS[ln]);pool=words}
  if(new Set(pool.map(w=>w.m)).size<4||words.length<4)return $('#er').textContent='Bài này chưa đủ dữ liệu để tạo câu hỏi (cần ít nhất 4 từ khác nhau).';
  S={name,ln,mode,words,pool,total:words.length,queue:shuffle(words),i:0,round:0,wrong:new Map(),next:[],t0:Date.now(),code:Math.random().toString(36).slice(2,8).toUpperCase()};
  ask();
 };
}
function ask(){
 const w=S.queue[S.i],dir=S.mode==='M'?(Math.random()<.5?'A':'B'):S.mode;
 const seen=new Set([w.m]),ds=[];
 const cand=shuffle(S.pool).filter(x=>x.h!==w.h).sort((a,b)=>Math.abs(a.h.length-w.h.length)-Math.abs(b.h.length-w.h.length)); /* ưu tiên đáp án nhiễu cùng số âm tiết (số chữ Hán) với từ hỏi */
 const seenH=new Set([w.h]);for(const x of cand){if(!seen.has(x.m)&&!seenH.has(x.h)){seen.add(x.m);seenH.add(x.h);ds.push(x);if(ds.length==3)break}}
 const opts=shuffle([w,...ds]);S.cur={w,done:false};
 const lab=x=>dir==='A'?`<span>${esc(x.m)}</span>`:`<span class="h">${esc(x.h)}</span>`;
 const prog=S.round?`Ôn lại ${S.i+1}/${S.queue.length}`:`${S.i+1}/${S.queue.length}`;
 app.innerHTML=`<div class="top"><span class="pill g">${S.round?'🔁 Ôn lại':'✦ Làm bài'}</span><span class="pill">${esc(S.ln.split('— ')[1])}</span><span class="pill">${prog}</span></div>
 <div class="hero"><small>${S.round?'TỪ CẦN ÔN':'TỪ MỚI'}</small>${dir==='A'?`<div class="big">${esc(w.h)}</div>`:`<div class="vi">${esc(w.m)}</div>`}</div>
 <div id="os">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${lab(o)}<i class="ic"></i></button>`).join('')}</div><div id="fb"></div>
 <button class="btn" id="nx" disabled>Tiếp tục →</button>`;
 document.querySelectorAll('.opt').forEach((b,k)=>b.onclick=()=>pick(k,opts,dir));
}
/* Đọc chữ Hán bằng giọng đọc tiếng Trung có sẵn của trình duyệt/thiết bị (không cần file âm thanh) */
function speak(t){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/…/g,' '));u.lang='zh-CN';u.rate=.85;const v=speechSynthesis.getVoices().find(x=>/^zh/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
try{speechSynthesis.getVoices()}catch(e){}
function pick(k,opts,dir){
 if(S.cur.done)return;S.cur.done=true;speak(opts[k].h);const w=S.cur.w,right=opts[k]===w;
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(opts[j]===w){b.classList.add('ok');b.querySelector('.ic').textContent='✓'}else if(j===k){b.classList.add('bad');b.querySelector('.ic').textContent='✕'}});
 const full=`${w.h} — ${w.p} — ${w.m}`;
 $('#fb').innerHTML=`<div class="fb ${right?'ok':'bad'}">${right?'✓ Chính xác!':'✕ Chưa đúng'}<span>Đáp án đúng: ${esc(full)}</span></div>`;
 if(!right){if(S.round===0)S.wrong.set(w.h+w.p+w.m,w);S.next.push(w)}
 const nx=$('#nx');nx.disabled=false;nx.onclick=advance;
}
function advance(){
 S.i++;
 if(S.i>=S.queue.length){
  if(S.next.length){S.queue=shuffle(S.next);S.next=[];S.i=0;S.round++}else return finish();
 }
 ask();
}
function finish(){
 const sec=Math.round((Date.now()-S.t0)/1000),n=S.wrong.size,d=new Date(),p=x=>String(x).padStart(2,'0');
 const ds=`${p(d.getHours())}:${p(d.getMinutes())} — ${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;
 app.innerHTML=`<div class="res"><h1>🎉 CHÚC MỪNG BẠN ĐÃ HOÀN THÀNH BÀI ÔN TỪ VỰNG!</h1>
 <div class="row"><span>Họ tên</span><b>${esc(S.name)}</b></div><div class="row"><span>Nội dung</span><b>${esc(S.ln)}</b></div>
 <div class="row"><span>Chiều</span><b>${{A:'Hán → Nghĩa',B:'Nghĩa → Hán',M:'Kết hợp'}[S.mode]}</b></div>

 <div class="row"><span>Đã nhớ ngay</span><b style="color:#0f9d6b">${S.total-n}/${S.total} từ</b></div>
 <div class="row"><span>Cần ôn thêm</span><b style="color:#e11d48">${n}/${S.total} từ</b></div>
 <div class="row"><span>Thời gian</span><b>${p(sec/60|0)} phút ${p(sec%60)} giây</b></div>
 <div class="row"><span>Hoàn thành lúc</span><b>${ds}</b></div><div class="row"><span>Mã lượt làm bài</span><b>${S.code}</b></div>
 <div class="msg">${n?'Bạn đã trả lời đúng toàn bộ các từ cần ôn lại. Hãy tiếp tục luyện tập để ghi nhớ từ vựng tốt hơn!':'Tuyệt vời! Bạn nhớ đúng tất cả các từ ngay lần đầu!'}</div>
