function parse(list){const m=new Map();list.forEach(r=>{const p=r.split('|');if(p.length<3||!p[1]||!p[2])return;const k=p[0]+'|'+p[1];if(!m.has(k))m.set(k,{h:p[0],p:p[1],m:p[2]})});return[...m.values()]}

 "冲动|chōngdòng":["买东西不要冲动。","Mua đồ đừng bốc đồng."],
 "消费|xiāofèi":["他的消费很高。","Mức tiêu dùng của anh ấy rất cao."],

 "效率|xiàolǜ":["这样做效率很高。","Làm như thế này hiệu suất rất cao."],
 "关注|guānzhù":["大家都很关注这件事。","Mọi người đều rất quan tâm việc này."],
 "秒|miǎo":["他十秒就跑完了。","Anh ấy chạy xong chỉ trong 10 giây."],
 "空|kōng":["这个盒子是空的。","Cái hộp này trống rỗng."],
 "熟悉|shúxī":["我对这里很熟悉。","Tôi rất quen thuộc với nơi này."],
 "当地|dāngdì":["我想尝尝当地的美食。","Tôi muốn nếm thử món ngon địa phương."],
 "快速|kuàisù":["他快速地完成了工作。","Anh ấy hoàn thành công việc nhanh chóng."],
 "适应|shìyìng":["我已经适应了这里的生活。","Tôi đã thích nghi với cuộc sống ở đây."],
 "必要|bìyào":["没有必要担心。","Không cần thiết phải lo lắng."],
 "理性|lǐxìng":["买东西要理性。","Mua đồ phải lý trí."]
};
const MODES=[['flash','Flashcard'],['match','Ghép thẻ'],['quiz','Trắc nghiệm']],MN=Object.fromEntries(MODES);
let S={name:'',q:1,les:'R',mode:'flash',dir:'A',mt:'m'},W=null,F,M,Q;
const seg=(id,items,k)=>`<div class="seg" id="${id}">${items.map(([v,t])=>`<button data-v="${v}" class="${S[k]==v?'on':''}">${t}</button>`).join('')}</div>`;
function bindSeg(id,k,cb){document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{S[k]=b.dataset.v;document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));cb&&cb()})}
const bar=(a,b)=>`<div class="top"><button class="pill" id="bk">← Chọn hình thức</button><span class="pill">${a}</span>${b?`<span class="pill g">${b}</span>`:''}</div>`;
app.addEventListener('click',e=>{if(e.target.closest('#bk'))menu()});
const big=w=>`<div class="big" style="font-size:${w.h.length>4?48:w.h.length>3?64:76}px">${esc(w.h)}</div>`;

function build(){
 const L=DATA[S.q];let pool;
 if(S.les==='R'){const seen=new Set();pool=[];Object.values(L).forEach(l=>parse(l).forEach(w=>{if(!seen.has(key(w))){seen.add(key(w));pool.push(w)}}));
  const words=[],uh=new Set();for(const w of shuffle(pool)){if(!uh.has(w.h)){uh.add(w.h);words.push(w);if(words.length==30)break}}
  W={words,pool,label:`Quyển ${S.q} — Ôn tổng hợp 30 từ`}}
 else{pool=parse(L[S.les]);W={words:pool,pool,label:S.les}}
}
function home(err=''){
 W=null;
 app.innerHTML=`<h1>🌸 Ôn từ vựng tiếng Trung</h1><p class="sub">Chọn quyển, bài học và hình thức ôn tập</p>
 <label>Họ và tên</label><input id="nm" placeholder="Nhập họ tên của em" maxlength="50" autocomplete="off" value="${esc(S.name)}">
 <label>Quyển</label>${seg('sq',[[1,'Quyển 1'],[2,'Quyển 2'],[3,'Quyển 3']],'q')}
 <label>Bài học</label><select id="ls"></select><div class="err" id="er">${err}</div><button class="btn" id="go">Tiếp tục</button>`;
 const fill=()=>{const ks=Object.keys(DATA[S.q]);if(S.les!=='R'&&!ks.includes(S.les))S.les='R';
  $('#ls').innerHTML='<option value="R">⭐ Ôn tổng hợp 30 từ</option>'+ks.map(k=>`<option value="${esc(k)}">${esc(k.split('— ')[1])}</option>`).join('');$('#ls').value=S.les};
 fill();bindSeg('sq','q',()=>{S.q=+S.q;S.les='R';fill()});
 $('#go').onclick=()=>{const n=$('#nm').value.trim().replace(/\s+/g,' ');
  if(n.length<2||!/\p{L}/u.test(n))return $('#er').textContent='Vui lòng nhập họ tên hợp lệ.';
  S.name=n;S.les=$('#ls').value;build();menu()};
}
function menu(err=''){
 app.innerHTML=`<div class="top"><button class="pill" id="hb">← Chọn bài</button><span class="pill g">${esc(W.label.split('— ')[1])}</span><span class="pill">${W.words.length} từ</span></div>
 <label>Hình thức ôn tập</label>${seg('sm',MODES,'mode')}<div id="opt"></div><div class="err" id="er">${err}</div><button class="btn" id="st">Bắt đầu</button>`;
 $('#hb').onclick=()=>home();
 const opt=()=>{const o=$('#opt');
  if(S.mode==='quiz'){o.innerHTML='<label>Chiều trắc nghiệm</label>'+seg('so',[['A','Hán → Nghĩa'],['B','Nghĩa → Hán'],['M','Kết hợp']],'dir');bindSeg('so','dir')}
  else if(S.mode==='match'){o.innerHTML='<label>Kiểu ghép</label>'+seg('so',[['m','Hán ↔ Nghĩa'],['p','Hán ↔ Pinyin']],'mt');bindSeg('so','mt')}
  else o.innerHTML=''};
 opt();bindSeg('sm','mode',opt);
 $('#st').onclick=()=>{
  if(S.mode==='quiz'&&(W.words.length<4||new Set(W.pool.map(w=>w.m)).size<4))return $('#er').textContent='Bài này chưa đủ dữ liệu để tạo câu hỏi (cần ít nhất 4 từ khác nhau).';
  if(W.words.length<2)return $('#er').textContent='Bài này chưa đủ từ để chơi.';
  ({flash,match,quiz})[S.mode]()};
}
function result(title,rows,msg,review,t0){
 const sec=Math.round((Date.now()-t0)/1000),d=new Date(),code=Math.random().toString(36).slice(2,8).toUpperCase();
 const all=[['Họ tên',S.name],['Nội dung',W.label],['Hình thức',MN[S.mode]],...rows,['Thời gian',`${p2(sec/60|0)} phút ${p2(sec%60)} giây`],['Hoàn thành lúc',`${p2(d.getHours())}:${p2(d.getMinutes())} — ${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`],['Mã lượt làm bài',code]];
 app.innerHTML=`<div class="res"><h1>🎉 ${title}</h1>${all.map(r=>`<div class="row"><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join('')}<div class="msg">${msg}</div>
 ${review.length?'<button class="btn s" id="vw">Xem các từ cần ôn</button><div id="rv"></div>':''}<button class="btn s" id="again">Làm lại</button><button class="btn s" id="mn">Chọn hình thức khác</button></div>`;
 const v=$('#vw');if(v)v.onclick=()=>{$('#rv').innerHTML='<div class="rv">'+review.map(w=>`<div>${esc(w.h)} — ${esc(w.p)} — ${esc(w.m)}</div>`).join('')+'</div>';v.remove()};
 $('#again').onclick=()=>({flash,match,quiz})[S.mode]();$('#mn').onclick=()=>menu();
}
/* ---------- Flashcard ---------- */
const exHtml=w=>{const e=EX[key(w)]||EX[w.h+'|'+w.p];return e?`<div class="ex"><b>${esc(e[0])}</b>${esc(e[1])}</div>`:''};
function flash(){F={queue:shuffle(W.words),i:0,round:1,known:new Set(),first:new Set(),flip:false,t0:Date.now()};fcard()}
function fcard(){
 const w=F.queue[F.i],k=key(w);
 app.innerHTML=bar(`Vòng ${F.round} · ${F.i+1}/${F.queue.length}`,`Đã thuộc ${F.known.size}/${W.words.length}`)+
 `<div class="hero fc" id="fc"><small>${F.flip?'PINYIN &amp; NGHĨA':'CHỮ HÁN — CHẠM ĐỂ LẬT'}</small>${F.flip?`<div class="py">${esc(w.p)}</div><div class="vi">${esc(w.m)}</div>${exHtml(w)}`:big(w)}</div>
 <div class="row2"><button class="btn bd" id="no">✕ Chưa thuộc</button><button class="btn" id="yes">✓ Đã thuộc</button></div>
 <div class="row2"><button class="btn s" id="pv" ${F.i?'':'disabled'}>‹ Thẻ trước</button><button class="btn s" id="nx">Thẻ sau ›</button></div>`;
 $('#fc').onclick=()=>{F.flip=!F.flip;if(F.flip)speak(w.h);fcard()};
 $('#yes').onclick=()=>{F.known.add(k);if(F.round===1)F.first.add(k);fadv()};
 $('#no').onclick=()=>{F.known.delete(k);F.first.delete(k);fadv()};
 $('#nx').onclick=fadv;$('#pv').onclick=()=>{F.i--;F.flip=false;fcard()};
}
function fadv(){
 F.i++;F.flip=false;
 if(F.i>=F.queue.length){const rest=F.queue.filter(w=>!F.known.has(key(w)));
  if(!rest.length){const n=W.words.length,f=F.first.size;
   return result('ĐÃ THUỘC TẤT CẢ CÁC TỪ!',[['Tổng số từ',n],['Thuộc ngay lần đầu',`${f}/${n} từ`],['Cần ôn thêm',`${n-f}/${n} từ`],['Số vòng ôn',F.round]],'Bạn đã đánh dấu thuộc toàn bộ các từ. Hãy tiếp tục luyện tập để ghi nhớ tốt hơn!',W.words.filter(w=>!F.first.has(key(w))),F.t0)}
  F.queue=shuffle(rest);F.i=0;F.round++}
 fcard();
}
/* ---------- Ghép thẻ ---------- */
function match(){M={left:shuffle(W.words),t0:Date.now(),done:0,mis:0,total:W.words.length,busy:false};mboard()}
function mboard(){
 const kf=S.mt==='m'?'m':'p',used=new Set(),b=[];
 for(const w of M.left){if(b.length<6&&!used.has(w[kf])&&!b.some(x=>x.h===w.h)){used.add(w[kf]);b.push(w)}}
 if(!b.length)return result('HOÀN THÀNH TRÒ CHƠI GHÉP THẺ!',[['Tổng số cặp',M.total],['Số lần ghép sai',M.mis]],'Bạn đã ghép đúng tất cả các cặp. Hãy chơi lại để nhớ từ tốt hơn!',[],M.t0);
 M.board=b;M.cards=shuffle(b.flatMap(w=>[{w,k:'h',t:w.h},{w,k:'o',t:w[kf]}]));M.sel=null;M.bad=[];mdraw();
}
function mdraw(){
 app.innerHTML=bar(`Đã ghép ${M.done}/${M.total}`,`Còn ${M.total-M.done} cặp`)+`<div class="grid">${M.cards.map((c,i)=>`<button class="mc ${c.k==='h'?'hz':''} ${c.ok?'ok':''} ${M.sel===i?'sel':''} ${M.bad.includes(i)?'bad':''}" data-i="${i}">${esc(c.t)}</button>`).join('')}</div>`;
 document.querySelectorAll('.mc').forEach(b=>b.onclick=()=>mtap(+b.dataset.i));
}
function mtap(i){
 const c=M.cards[i];if(M.busy||c.ok)return;
 if(c.k==='h')speak(c.w.h);
 if(M.sel===null){M.sel=i;return mdraw()}
 if(M.sel===i){M.sel=null;return mdraw()}
 const a=M.cards[M.sel];
 if(a.k!==c.k&&a.w===c.w){a.ok=c.ok=true;M.done++;M.sel=null;mdraw();
  if(M.cards.every(x=>x.ok)){M.busy=true;setTimeout(()=>{M.left=M.left.filter(w=>!M.board.includes(w));M.busy=false;mboard()},500)}}
 else{M.mis++;M.bad=[M.sel,i];M.busy=true;mdraw();setTimeout(()=>{M.bad=[];M.sel=null;M.busy=false;mdraw()},600)}
}
/* ---------- Trắc nghiệm ---------- */
function quiz(){Q={queue:shuffle(W.words),i:0,round:0,wrong:new Map(),next:[],ok:0,t0:Date.now()};qask()}
function qask(){
 const w=Q.queue[Q.i],dir=S.dir==='M'?(Math.random()<.5?'A':'B'):S.dir,seen=new Set([w.m]),seenH=new Set([w.h]),ds=[];
 const cand=shuffle(W.pool).filter(x=>x.h!==w.h).sort((a,b)=>Math.abs(a.h.length-w.h.length)-Math.abs(b.h.length-w.h.length));
 for(const x of cand){if(!seen.has(x.m)&&!seenH.has(x.h)){seen.add(x.m);seenH.add(x.h);ds.push(x);if(ds.length==3)break}}
 const opts=shuffle([w,...ds]);Q.cur={w,done:false};
 const lab=x=>dir==='A'?`<span>${esc(x.m)}</span>`:`<span class="h">${esc(x.h)}</span>`;
 app.innerHTML=bar(`${Q.round?'Ôn lại ':''}${Q.i+1}/${Q.queue.length}`,`Điểm ${Q.ok}`)+
 `<div class="hero"><small>${Q.round?'TỪ CẦN ÔN':'TỪ MỚI'}</small>${dir==='A'?big(w):`<div class="vi">${esc(w.m)}</div>`}</div>
 <div id="os">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${lab(o)}<i class="ic"></i></button>`).join('')}</div><div id="fb"></div><button class="btn" id="nx" disabled>Tiếp tục →</button>`;
 document.querySelectorAll('.opt').forEach((b,k)=>b.onclick=()=>qpick(k,opts));
}
function qpick(k,opts){
 if(Q.cur.done)return;Q.cur.done=true;speak(opts[k].h);const w=Q.cur.w,right=opts[k]===w;
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(opts[j]===w){b.classList.add('ok');b.querySelector('.ic').textContent='✓'}else if(j===k){b.classList.add('bad');b.querySelector('.ic').textContent='✕'}});
 $('#fb').innerHTML=`<div class="fb ${right?'ok':'bad'}">${right?'✓ Chính xác!':'✕ Chưa đúng'}<span>Đáp án đúng: ${esc(w.h)} — ${esc(w.p)} — ${esc(w.m)}</span></div>`;
 if(right){if(Q.round===0)Q.ok++}else{if(Q.round===0)Q.wrong.set(key(w),w);Q.next.push(w)}
 const nx=$('#nx');nx.disabled=false;nx.onclick=qadv;
}
function qadv(){
 Q.i++;
 if(Q.i>=Q.queue.length){
  if(Q.next.length){Q.queue=shuffle(Q.next);Q.next=[];Q.i=0;Q.round++}
  else{const n=Q.wrong.size,t=W.words.length;
   return result('CHÚC MỪNG BẠN ĐÃ HOÀN THÀNH BÀI ÔN TỪ VỰNG!',[['Chiều',{A:'Hán → Nghĩa',B:'Nghĩa → Hán',M:'Kết hợp'}[S.dir]],['Tổng số từ',t],['Đã nhớ ngay',`${t-n}/${t} từ`],['Cần ôn thêm',`${n}/${t} từ`]],n?'Bạn đã trả lời đúng toàn bộ các từ cần ôn lại. Hãy tiếp tục luyện tập để ghi nhớ từ vựng tốt hơn!':'Tuyệt vời! Bạn nhớ đúng tất cả các từ ngay lần đầu!',[...Q.wrong.values()],Q.t0)}}
 qask();
}
home();
</script></body></html>
